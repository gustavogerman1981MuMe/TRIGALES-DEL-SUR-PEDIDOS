<title>Trigales del Sur</title>
<!-- PARA LOS CELULARES QUE TIENEN GUARDADA LA PAGINA VIEJA. (2026-10-10.)

     La pagina de pedidos vivio un tiempo con el link del «CONOCENOS» escrito
     relativo (href="negocio/"). Cuando el sitio se mudo a trigalesdelsur.com.ar
     la pagina de pedidos paso a /pedidos/, asi que ese link empezo a resolver a
     /pedidos/negocio/ -- que no existia -- y daba 404.

     La plantilla ya quedo con la direccion COMPLETA, pero un celular que tenga
     la pagina vieja guardada sigue teniendo el link roto adentro. Esta hoja
     esta para esos: los manda sola a la pagina del negocio.

     NO BORRAR mientras pueda quedar alguna copia vieja dando vueltas. -->
<link rel="canonical" href="https://trigalesdelsur.com.ar/">
<meta http-equiv="refresh" content="0; url=https://trigalesdelsur.com.ar/">
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center;
         background:#FBF7EE; color:#2A2117; font:16px/1.6 system-ui, sans-serif;
         padding:24px; text-align:center }
  a { color:#8B4A2B; font-weight:700 }
</style>
</head>
<body>
  <div>
    <p>Trigales del Sur se mudó de dirección.</p>
    <p><a href="https://trigalesdelsur.com.ar/">Entrá a trigalesdelsur.com.ar</a></p>
  </div>
  <script>location.replace("https://trigalesdelsur.com.ar/");</script>
</body>
</html>
